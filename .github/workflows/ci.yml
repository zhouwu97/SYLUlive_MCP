name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      HY3_MODE: fixture
      HY3_CAMPUS_ROOT: ./examples
      HY3_FIXTURE_ROOT: ./tests/fixtures/hy3
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python evaluation/run_evaluation.py --check
      - run: uv run hy3-campus-decision-mcp --version
      - run: uv run hy3-campus-decision-mcp --selfcheck
      - run: uv run python scripts/sdk_stdio_client.py
      - run: uv build
      - run: uv run python scripts/verify_distribution.py
